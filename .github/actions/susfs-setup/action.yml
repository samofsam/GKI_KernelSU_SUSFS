name: 'Setup SUSFS Branch'
description: 'Clone SUSFS repo and cherry-pick commits'
inputs:
  susfs_commit:
    description: 'SUSFS commit hash (empty = latest on auto-derived gki-{version} branch)'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  root_flavor:
    description: 'Selected root implementation - pershoot patches only apply to next'
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Clone SUSFS Branch
      shell: bash
      run: |
        set -euo pipefail

        # Retry transient network errors (up to 5 attempts, 5s backoff).
        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"
        echo "Cloning latest from $SUSFS_BRANCH..."
        retry git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

        if [ -n "${{ inputs.susfs_commit }}" ]; then
          echo "Checking out SUSFS commit: ${{ inputs.susfs_commit }}"
          retry git -C "${{ github.workspace }}/susfs4ksu" checkout "${{ inputs.susfs_commit }}"
        fi

        cd "${{ github.workspace }}/susfs4ksu"
        SUSFS_COMMIT="$(git rev-parse HEAD)"
        echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> "$GITHUB_ENV"
        echo "Using SUSFS commit: $SUSFS_COMMIT"

        # An explicit SUSFS commit is an immutable source lock. Do not layer
        # moving pershoot branch tips on top of it: that breaks reproducibility
        # and can leave unresolved conflict markers while the step still appears
        # successful. Only the legacy/unpinned path may consume that overlay.
        if [ "${{ inputs.root_flavor }}" = "next" ]; then
          if [ -n "${{ inputs.susfs_commit }}" ]; then
            echo "[LOCK] KernelSU-Next: keeping pinned SUSFS commit unchanged; pershoot moving overlay disabled."
          else
            git fetch https://gitlab.com/pershoot/susfs4ksu.git gki-android14-6.1-dev
            mapfile -t PERSHOOT_COMMITS < <(git log ..FETCH_HEAD --format='%H' -n 2 | tac)
            for commit in "${PERSHOOT_COMMITS[@]}"; do
              [ -n "$commit" ] || continue
              echo "Applying pershoot SUSFS compatibility commit: $commit"
              if ! git cherry-pick "$commit"; then
                git status --short || true
                git cherry-pick --abort || true
                echo "ERROR: pershoot SUSFS compatibility cherry-pick conflicted." >&2
                exit 1
              fi
            done
          fi
        fi

        # Never allow a source tree with unresolved merges/conflict markers to
        # progress into kernel/common.
        if git diff --name-only --diff-filter=U | grep -q .; then
          echo "ERROR: SUSFS checkout contains unresolved Git paths." >&2
          git status --short >&2 || true
          exit 1
        fi
        if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' kernel_patches --exclude='*.md'; then
          echo "ERROR: SUSFS checkout contains version-control conflict markers." >&2
          exit 1
        fi
